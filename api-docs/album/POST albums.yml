info:
  name: POST albums
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/albums
  body:
    type: json
    data: |-
      {
        "title": "The Dark Side of the Moon", 
        "artistName": "Pink Floyd", 
        "releaseYear": 1973
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
